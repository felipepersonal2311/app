{% extends "base.html" %}

{% block title %}{{ 'Editar' if post else 'Novo' }} Post - Admin{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-8 mx-auto">
    <div class="d-flex align-items-center mb-4 gap-3">
      <a href="{{ url_for('admin') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h1 class="fw-bold h2 mb-0">{{ 'Editar Post' if post else 'Novo Post' }}</h1>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label for="title" class="form-label fw-semibold">Título</label>
            <input type="text" class="form-control" id="title" name="title"
                   value="{{ post.title if post else '' }}"
                   placeholder="Digite o título do post" required>
          </div>

          <div class="mb-3">
            <label for="content" class="form-label fw-semibold">Conteúdo</label>
            <textarea class="form-control" id="content" name="content" rows="14"
                      placeholder="Escreva o conteúdo do post aqui..." required>{{ post.content if post else '' }}</textarea>
          </div>

          <div class="mb-4">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="published" name="published"
                     {{ 'checked' if post and post.published else '' }}>
              <label class="form-check-label fw-semibold" for="published">
                Publicar imediatamente
              </label>
            </div>
            <small class="text-muted">Posts não publicados ficam como rascunho e não aparecem no blog.</small>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-dark">
              <i class="bi bi-check-lg me-1"></i>{{ 'Salvar alterações' if post else 'Criar post' }}
            </button>
            <a href="{{ url_for('admin') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
