services:
  - type: web
    name: loja-fitness
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_NUMBER
        value: "5561996994875"
      - key: STORE_NAME
        value: "Nome da Loja"
    # No plano gratuito o disco é apagado a cada novo deploy, então os produtos
    # cadastrados e as fotos enviadas pelo /admin somem quando o código for
    # atualizado. Para guardar isso de forma permanente, mude "plan" para um
    # plano pago e adicione um disco persistente (ver README, seção "Deploy").
